name: Vérifier Ludux

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier l'application et Ludux Connect
        run: npm run check

  connect-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LUDUX_CONNECT_URL: ${{ vars.LUDUX_CONNECT_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier l'adresse publique de Ludux Connect
        run: npm run connect:verify-url

      - name: Construire l'image Ludux Connect
        run: docker build -f connect/Dockerfile -t ludux-connect:test .
