name: Publier Ludux pour Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LUDUX_CONNECT_URL: ${{ vars.LUDUX_CONNECT_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier l'adresse publique de Ludux Connect
        run: npm run connect:verify-url

      - name: Vérifier le projet
        run: npm run check

      - name: Construire l'installeur Windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run package:win

      - name: Vérifier l'installeur Windows
        env:
          LUDUX_REQUIRE_SIGNED_RELEASE: ${{ secrets.WINDOWS_CERTIFICATE != '' && '1' || '0' }}
        run: npm run verify:release:win

      - name: Tester l'application empaquetée
        run: npm run e2e:electron:packaged

      - name: Publier la release et ses fichiers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $version = $package.version
          $tag = $env:GITHUB_REF_NAME

          if ($tag -ne "v$version") {
            throw "Le tag $tag ne correspond pas à la version $version de package.json."
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "Ludux $version" `
              --notes "Installeur Windows de Ludux $version. Les prochaines mises à jour seront proposées automatiquement dans l'application."
            if ($LASTEXITCODE -ne 0) {
              throw "La release GitHub $tag n'a pas pu être créée."
            }
          }

          $assets = @(
            "release/Ludux-Setup-$version-x64.exe"
            "release/Ludux-Setup-$version-x64.exe.blockmap"
            "release/Ludux-Setup-$version-x64.exe.sha256"
            "release/latest.yml"
          )

          gh release upload $tag $assets `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Les fichiers de la release GitHub $tag n'ont pas pu être publiés."
          }
